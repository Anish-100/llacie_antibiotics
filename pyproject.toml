[project]
name = "llacie"
version = "1.0.4"
requires-python = ">=3.11"
authors = [{ name = "Theodore Pak", email = "theodore.r.pak@gmail.com" }]
description = "An LLM-based clinical information extraction toolkit."
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "click>=8.1",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "platformdirs>=4.0",
    "tqdm>=4.66",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "transformers>=4.40",
    "scikit-learn>=1.4",
    "jinja2>=3.1",
    "tabulate>=0.9",
    "confidenceinterval>=1.0.4",
    "openai>=1.50",
    # 0.3.21+ ships universal (py3) prebuilt wheels on the abetlen index; see [tool.uv.sources]
    "llama-cpp-python>=0.3.21",
]
keywords = [
    "natural language processing",
    "large language model",
    "clinical informatics",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
edw = ["pyodbc>=5.0"]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-dependency>=0.6",
]

[project.scripts]
llacie = "llacie.scripts.llacie:main"

# Local development groups (not published). `uv sync` installs `dev` by default.
[dependency-groups]
dev = [
    "llacie[test]",
    "ruff>=0.8",
    # Used by the standalone llacie/database/scraper.py tool that builds drugs.db
    "beautifulsoup4>=4.12",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llacie"]

[tool.hatch.build.targets.sdist]
exclude = [
    "llacie/vocabs/.cache",
    "**/.DS_Store",
    "**/~$*",
    "Dockerfile",
    "docker-compose.yml",
    "docker-compose.*.yml",
    ".dockerignore",
]

# PyPI only publishes an sdist for llama-cpp-python (compiles from source). On Linux (incl. the
# Docker image) pull prebuilt CPU wheels from the project's own index instead. The macOS wheels on
# that index are malformed upstream (bad zip offsets, as of 0.3.30-0.3.36), so macOS builds from
# the PyPI sdist, which also enables Metal. Needs Xcode command line tools.
[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = [
    { index = "llama-cpp-cpu", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "E501",  # line too long (handled by line-length)
    "E701",  # multiple statements on one line
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint.per-file-ignores]
# Ignore import rules in __init__.py files
"__init__.py" = ["F401"]
# Ignore all rules in test files except errors
"tests/**/*.py" = ["N", "UP"]
